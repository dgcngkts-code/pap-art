<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pap Art Nail Studio — Canlı Yönetim Paneli</title>

<style>
  :root {
    --bg-main: #f1f5f9; --card-bg: #ffffff; --text-primary: #0f172a;
    --text-muted: #64748b; --border: #cbd5e1; --primary: #881337;
    --card-blue: #2563eb; --cash-green: #16a34a; --expense-orange: #ea580c;
    --danger: #dc2626; --purple: #7c3aed; --radius: 10px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: var(--bg-main); color: var(--text-primary); padding: 12px 10px; }
  .container { max-width: 1000px; margin: 0 auto; }
  header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; padding: 12px; background: var(--card-bg); border-radius: var(--radius); border: 1px solid var(--border); }
  h1 { font-size: 1.1rem; color: var(--primary); }
  .user-badge { font-size: 0.8rem; background: #f1f5f9; padding: 4px 8px; border-radius: 20px; border: 1px solid var(--border); }
  .logout-btn { background: none; border: none; color: var(--danger); cursor: pointer; font-size: 0.8rem; font-weight: bold; margin-left: 6px; }
  .login-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; max-width: 360px; margin: 30px auto; }
  .login-card h2 { margin-bottom: 12px; font-size: 1.1rem; text-align: center; color: var(--primary); }
  .role-tabs { display: flex; gap: 6px; margin-bottom: 12px; }
  .role-tabs button { flex: 1; padding: 8px; border: 1px solid var(--border); border-radius: 6px; background: #f8fafc; cursor: pointer; font-weight: 600; font-size: 0.85rem; }
  .role-tabs button.active { background: var(--primary); color: white; border-color: var(--primary); }
  .field { margin-bottom: 10px; }
  .field label { display: block; font-size: 0.75rem; color: var(--text-muted); margin-bottom: 3px; font-weight: 600; }
  .field input, .field select { width: 100%; padding: 8px; border: 1px solid var(--border); border-radius: 6px; font-size: 0.9rem; }
  .btn { width: 100%; padding: 10px; background: var(--primary); color: white; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; }
  .btn-sm { padding: 4px 8px; font-size: 0.72rem; border-radius: 4px; border: none; cursor: pointer; }
  .btn-delete { background: var(--danger); color: white; }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .panel { background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px; margin-bottom: 12px; }
  .panel-title { font-size: 0.88rem; font-weight: 700; margin-bottom: 8px; color: var(--primary); border-bottom: 1px solid var(--border); padding-bottom: 4px; }
  .metrics-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 8px; margin-bottom: 12px; }
  .metric-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--radius); padding: 10px; }
  .metric-title { font-size: 0.65rem; color: var(--text-muted); text-transform: uppercase; font-weight: 700; }
  .metric-value { font-size: 1.1rem; font-weight: 700; margin-top: 2px; font-family: monospace; }
  table { width: 100%; border-collapse: collapse; font-size: 0.78rem; }
  th { text-align: left; padding: 6px; border-bottom: 2px solid var(--border); color: var(--text-muted); background: #f8fafc; }
  td { padding: 6px; border-bottom: 1px solid var(--border); }
  td.num { font-family: monospace; font-weight: 600; text-align: right; }
  .hidden { display: none !important; }
</style>
</head>
<body>

<div class="container">
  <header id="main-header" class="hidden">
    <div>
      <h1>Pap Art Studio</h1>
      <div style="font-size:0.75rem; color:var(--text-muted);">Canlı Veri Senkronizasyonu</div>
    </div>
    <div class="user-badge">
      <span id="user-display-name">...</span>
      <button class="logout-btn" id="logout-btn">Çıkış</button>
    </div>
  </header>

  <!-- GİRİŞ EKRANI -->
  <div id="view-login" class="login-card">
    <h2>Sistem Girişi</h2>
    <div class="role-tabs">
      <button id="btn-role-staff" class="active">Personel</button>
      <button id="btn-role-owner">İşletmeci</button>
    </div>

    <div id="login-staff-fields">
      <div class="field">
        <label>Personel Seçin</label>
        <select id="login-staff-select"><option value="">Yükleniyor...</option></select>
      </div>
    </div>

    <div class="field">
      <label>PIN Kodu</label>
      <input type="password" id="login-pin" placeholder="••••" maxlength="8">
    </div>

    <button class="btn" id="login-btn">Giriş Yap</button>
  </div>

  <!-- PERSONEL EKRANI -->
  <div id="view-staff" class="hidden">
    <div class="panel">
      <div class="panel-title">İşlem Ekle</div>
      <div class="grid-3">
        <div class="field"><label>Tarih</label><input type="date" id="entry-date"></div>
        <div class="field"><label>Müşteri</label><input type="text" id="entry-customer" placeholder="Müşteri Adı"></div>
        <div class="field"><label>İşlem</label><input type="text" id="entry-service" placeholder="Yapılan İşlem"></div>
      </div>
      <div class="grid-2">
        <div class="field"><label>Kart ₺</label><input type="number" id="entry-card" placeholder="0"></div>
        <div class="field"><label>Nakit ₺</label><input type="number" id="entry-cash" placeholder="0"></div>
      </div>
      <button class="btn" id="save-record-btn">Kaydet</button>
    </div>

    <div class="panel">
      <div class="panel-title">Girdiğiniz Kayıtlar</div>
      <table>
        <thead><tr><th>Tarih</th><th>Müşteri / İşlem</th><th>Tutar</th><th style="text-align:right;">İşlem</th></tr></thead>
        <tbody id="staff-records-body"></tbody>
      </table>
    </div>
  </div>

  <!-- İŞLETMECİ EKRANI -->
  <div id="view-owner" class="hidden">
    <div class="metrics-grid">
      <div class="metric-card"><div class="metric-title">Toplam Ciro</div><div class="metric-value" id="m-net-revenue" style="color:var(--primary);">0 ₺</div></div>
      <div class="metric-card"><div class="metric-title">Kart (POS)</div><div class="metric-value" id="m-card-gross" style="color:var(--card-blue);">0 ₺</div></div>
      <div class="metric-card"><div class="metric-title">Nakit</div><div class="metric-value" id="m-cash-total" style="color:var(--cash-green);">0 ₺</div></div>
      <div class="metric-card"><div class="metric-title">Dükkan Gideri</div><div class="metric-value" id="m-shop-expenses" style="color:var(--danger);">0 ₺</div></div>
    </div>

    <div class="panel">
      <div class="panel-title">İşletme Gideri Ekle</div>
      <div class="grid-3">
        <div class="field"><input type="date" id="exp-date"></div>
        <div class="field"><input type="text" id="exp-desc" placeholder="Açıklama (Kira vb.)"></div>
        <div class="field"><input type="number" id="exp-amount" placeholder="Tutar ₺"></div>
      </div>
      <button class="btn" id="add-expense-btn">Gider Ekle</button>
    </div>

    <div class="panel">
      <div class="panel-title">Tüm Personellerin Canlı Verileri</div>
      <table>
        <thead>
          <tr><th>Tarih</th><th>Personel</th><th>Müşteri/İşlem</th><th class="num">Tutar</th><th style="text-align:right;">Sil</th></tr>
        </thead>
        <tbody id="owner-records-body"></tbody>
      </table>
    </div>

    <div class="panel">
      <div class="panel-title">Personel Tanımla</div>
      <div class="grid-2">
        <div class="field"><input type="text" id="new-s-name" placeholder="Personel Adı"></div>
        <div class="field"><input type="password" id="new-s-pin" placeholder="PIN (Örn: 1234)"></div>
      </div>
      <button class="btn" id="add-staff-btn">Personeli Kaydet</button>
      <div id="owner-staff-list" style="margin-top:10px;"></div>
    </div>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getFirestore, collection, addDoc, onSnapshot, doc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  // 1. Firebase Yapılandırması
  const firebaseConfig = {
    apiKey: "AIzaSyB1whuNESO5qo5uqXLAjQN6u57NLnJd3H0",
    authDomain: "papart-35567.firebaseapp.com",
    projectId: "papart-35567",
    storageBucket: "papart-35567.firebasestorage.app",
    messagingSenderId: "491237623263",
    appId: "1:491237623263:web:d862d5065cd008d08c306a",
    measurementId: "G-NYPS5F4TQW"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  const DEFAULT_OWNER_PIN = "0000";
  let state = {
    role: 'staff',
    activeUser: null,
    config: { posTax: 10, vat: 20, targetRevenue: 200000 },
    staffList: [],
    records: [],
    expenses: []
  };

  let loginRoleState = 'staff';
  const getTodayStr = () => new Date().toISOString().split('T')[0];

  // 2. Gerçek Zamanlı Dinleme (Real-time Sync)
  onSnapshot(collection(db, "records"), (snapshot) => {
    state.records = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
    if (state.role === 'staff') renderStaffRecords();
    if (state.role === 'owner') renderOwnerDashboard();
  });

  onSnapshot(collection(db, "expenses"), (snapshot) => {
    state.expenses = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
    if (state.role === 'owner') renderOwnerDashboard();
  });

  onSnapshot(collection(db, "staff"), (snapshot) => {
    state.staffList = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
    renderStaffSelect();
    if (state.role === 'owner') renderOwnerDashboard();
  });

  // UI Event Handler'ları
  document.getElementById('btn-role-staff').onclick = () => setLoginRole('staff');
  document.getElementById('btn-role-owner').onclick = () => setLoginRole('owner');
  document.getElementById('login-btn').onclick = handleLogin;
  document.getElementById('logout-btn').onclick = logout;
  document.getElementById('save-record-btn').onclick = saveRecord;
  document.getElementById('add-expense-btn').onclick = addExpense;
  document.getElementById('add-staff-btn').onclick = addNewStaff;

  function setLoginRole(role) {
    loginRoleState = role;
    document.getElementById('btn-role-staff').className = role === 'staff' ? 'active' : '';
    document.getElementById('btn-role-owner').className = role === 'owner' ? 'active' : '';
    document.getElementById('login-staff-fields').classList.toggle('hidden', role === 'owner');
  }

  function renderStaffSelect() {
    const select = document.getElementById('login-staff-select');
    select.innerHTML = state.staffList.map(s => `<option value="${s.id}">${s.name}</option>`).join('');
  }

  function handleLogin() {
    const pin = document.getElementById('login-pin').value;
    if (loginRoleState === 'owner') {
      if (pin === DEFAULT_OWNER_PIN) {
        state.role = 'owner';
        state.activeUser = { name: 'İşletmeci' };
        showView('owner');
      } else { alert("Hatalı PIN!"); }
    } else {
      const staffId = document.getElementById('login-staff-select').value;
      const staff = state.staffList.find(s => s.id === staffId);
      if (staff && staff.pin === pin) {
        state.role = 'staff';
        state.activeUser = staff;
        showView('staff');
      } else { alert("Hatalı PIN!"); }
    }
    document.getElementById('login-pin').value = '';
  }

  function logout() { state.activeUser = null; showView('login'); }

  function showView(view) {
    document.getElementById('view-login').classList.add('hidden');
    document.getElementById('view-staff').classList.add('hidden');
    document.getElementById('view-owner').classList.add('hidden');
    document.getElementById('main-header').classList.add('hidden');

    if (view === 'login') {
      document.getElementById('view-login').classList.remove('hidden');
    } else {
      document.getElementById('main-header').classList.remove('hidden');
      document.getElementById('user-display-name').textContent = state.activeUser.name;
      if (view === 'staff') {
        document.getElementById('view-staff').classList.remove('hidden');
        document.getElementById('entry-date').value = getTodayStr();
        renderStaffRecords();
      } else if (view === 'owner') {
        document.getElementById('view-owner').classList.remove('hidden');
        document.getElementById('exp-date').value = getTodayStr();
        renderOwnerDashboard();
      }
    }
  }

  // 3. Veri Kaydetme ve Silme İşlevleri (Firestore)
  async function saveRecord() {
    const date = document.getElementById('entry-date').value || getTodayStr();
    const customer = document.getElementById('entry-customer').value.trim();
    const service = document.getElementById('entry-service').value.trim();
    const card = parseFloat(document.getElementById('entry-card').value) || 0;
    const cash = parseFloat(document.getElementById('entry-cash').value) || 0;

    if (!customer || !service) { alert("Müşteri ve işlem bilgilerini giriniz."); return; }

    await addDoc(collection(db, "records"), {
      staffId: state.activeUser.id,
      staffName: state.activeUser.name,
      date, customer, service, card, cash
    });

    document.getElementById('entry-customer').value = '';
    document.getElementById('entry-service').value = '';
    document.getElementById('entry-card').value = '';
    document.getElementById('entry-cash').value = '';
  }

  async function addExpense() {
    const date = document.getElementById('exp-date').value || getTodayStr();
    const desc = document.getElementById('exp-desc').value.trim();
    const amount = parseFloat(document.getElementById('exp-amount').value) || 0;

    if (!desc || amount <= 0) return;

    await addDoc(collection(db, "expenses"), { date, desc, amount });
    document.getElementById('exp-desc').value = '';
    document.getElementById('exp-amount').value = '';
  }

  async function addNewStaff() {
    const name = document.getElementById('new-s-name').value.trim();
    const pin = document.getElementById('new-s-pin').value.trim();
    if (!name || !pin) return;

    await addDoc(collection(db, "staff"), { name, pin });
    document.getElementById('new-s-name').value = '';
    document.getElementById('new-s-pin').value = '';
  }

  window.deleteRecordDoc = async (id) => { await deleteDoc(doc(db, "records", id)); };
  window.deleteExpenseDoc = async (id) => { await deleteDoc(doc(db, "expenses", id)); };
  window.deleteStaffDoc = async (id) => { await deleteDoc(doc(db, "staff", id)); };

  function renderStaffRecords() {
    const tbody = document.getElementById('staff-records-body');
    const myRecords = state.records.filter(r => r.staffId === state.activeUser.id);
    tbody.innerHTML = myRecords.map(r => `
      <tr>
        <td>${r.date}</td>
        <td><b>${r.customer}</b><br>${r.service}</td>
        <td class="num">${(r.card + r.cash).toLocaleString()} ₺</td>
        <td style="text-align:right;"><button class="btn-sm btn-delete" onclick="window.deleteRecordDoc('${r.id}')">Sil</button></td>
      </tr>
    `).join('');
  }

  function renderOwnerDashboard() {
    let cardTotal = 0, cashTotal = 0;
    state.records.forEach(r => { cardTotal += r.card; cashTotal += r.cash; });
    const expTotal = state.expenses.reduce((s, e) => s + e.amount, 0);

    document.getElementById('m-net-revenue').textContent = (cardTotal + cashTotal).toLocaleString() + ' ₺';
    document.getElementById('m-card-gross').textContent = cardTotal.toLocaleString() + ' ₺';
    document.getElementById('m-cash-total').textContent = cashTotal.toLocaleString() + ' ₺';
    document.getElementById('m-shop-expenses').textContent = expTotal.toLocaleString() + ' ₺';

    document.getElementById('owner-staff-list').innerHTML = state.staffList.map(s => `
      <div style="display:flex; justify-content:space-between; align-items:center; padding:4px 0;">
        <span><b>${s.name}</b> (PIN: ${s.pin})</span>
        <button class="btn-sm btn-delete" onclick="window.deleteStaffDoc('${s.id}')">Sil</button>
      </div>
    `).join('');

    document.getElementById('owner-records-body').innerHTML = state.records.map(r => `
      <tr>
        <td>${r.date}</td>
        <td><b>${r.staffName}</b></td>
        <td><b>${r.customer}</b> (${r.service})</td>
        <td class="num">${(r.card + r.cash).toLocaleString()} ₺</td>
        <td style="text-align:right;"><button class="btn-sm btn-delete" onclick="window.deleteRecordDoc('${r.id}')">Sil</button></td>
      </tr>
    `).join('');
  }

  showView('login');
</script>
</body>
</html>
